<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Etihad Everywhere App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&family=Poppins:ital,wght@1,800&display=swap">
<style>
/* Mobile app prototype (Hub tab) in the bank app's own visual language: white cards on a soft grey ground, orange tiles,
   taupe for investment, purple for insurance. The new Lifestyle tile "Etihad Everywhere" is deliberately different:
   a burgundy-to-orange tile with a pin and a live radar pulse. Tapping it opens the customer feature as a full screen. */
:root{
  color-scheme:light;
  --ground:#F2F2F4; --card:#FFFFFF; --ink:#1E1E24; --ink-2:#4A4A55; --muted:#6B6B76; --line:#E7E5EA;
  --o1:#FF7A3D; --o2:#F04E1A; --o-soft:#FFF0E8; --o-text:#C2410C;
  --amber1:#FFA53A; --amber2:#FF7E1F;
  --taupe1:#BBA999; --taupe2:#9E8B7B;
  --plum1:#5E3B72; --plum2:#47295A;
  --burg1:#8A1030; --burg2:#5E0A22; --cream:#FBEFE3; --wine:#7A0C27;
  --ok:#15803D; --ok-soft:#E7F6EC; --warn:#B45309; --warn-soft:#FDF3E2; --bad:#B91C1C; --bad-soft:#FDECEC;
  --f:"Lexend","Segoe UI",system-ui,sans-serif; --f-brand:Poppins,"Segoe UI",Arial,sans-serif;
  --r:22px; --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:#E9E6EC;color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.45;touch-action:manipulation;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--o2);outline-offset:2px;border-radius:10px}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
.ico{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* desktop: show the app inside a phone; phone: full screen */
.stage{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.proto{font-size:.78rem;color:#5B5560;text-align:center;margin:0 0 10px}
.phone{position:relative;width:390px;height:844px;max-height:calc(100vh - 70px);background:var(--ground);border-radius:46px;box-shadow:0 0 0 10px #111,0 30px 70px rgb(0 0 0 / .3);overflow:hidden;display:flex;flex-direction:column}
@media (max-width:500px){.stage{padding:0;display:block}.proto{display:none}.phone{width:100%;height:100vh;height:100dvh;max-height:none;border-radius:0;box-shadow:none}}

/* top bar */
.topbar{display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 12px;background:var(--card);box-shadow:0 2px 10px rgb(0 0 0 / .05);z-index:5}
.avatar{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;background:var(--card)}
.avatar span{width:30px;height:30px;border-radius:50%;background:linear-gradient(160deg,var(--o1),var(--o2));display:grid;place-items:center;color:#fff}
.plan-chip{margin-inline:auto;display:inline-flex;align-items:center;gap:6px;background:linear-gradient(160deg,var(--o1),var(--o2));color:#fff;border:0;border-radius:999px;padding:8px 16px;font-weight:500;cursor:pointer;min-height:40px;transition:transform .2s var(--ease)}
.plan-chip:active{transform:scale(.97)}
.icon-btn{position:relative;width:44px;height:44px;border:0;background:none;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.icon-btn:hover{background:var(--ground)}
.icon-btn .dot{position:absolute;top:9px;inset-inline-end:10px;width:9px;height:9px;border-radius:50%;background:var(--o2);border:2px solid var(--card)}

/* hub */
.scroll{flex:1;overflow:auto;overscroll-behavior:contain;padding:14px 14px 18px;display:grid;gap:14px;align-content:start}
.sect{background:var(--card);border-radius:var(--r);padding:16px 12px 8px}
.sect h2{font-size:1.05rem;font-weight:500;color:var(--ink-2);margin:2px 8px 12px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 6px;list-style:none;margin:0;padding:0}
.tile{display:grid;justify-items:center;gap:7px;background:none;border:0;padding:0 0 8px;cursor:pointer;color:var(--ink);text-align:center;min-width:0}
.tile .t{position:relative;width:66px;height:66px;border-radius:18px;display:grid;place-items:center;color:#fff;overflow:hidden;transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
.tile .t::before{content:"";position:absolute;inset:auto -20% -35% -20%;height:70%;background:rgb(255 255 255 / .12);border-radius:50% 50% 0 0;transform:rotate(-8deg)}
.tile .t .ico{position:relative;width:28px;height:28px}
.tile:hover .t{transform:translateY(-2px);box-shadow:0 8px 18px rgb(0 0 0 / .14)}
.tile:active .t{transform:scale(.96)}
.tile .l{font-size:.76rem;line-height:1.25;overflow-wrap:normal;word-break:normal;hyphens:manual;max-width:100%}
.t-prod{background:linear-gradient(160deg,var(--o1),var(--o2))}
.t-inv{background:linear-gradient(160deg,var(--taupe1),var(--taupe2))}
.t-life{background:linear-gradient(160deg,var(--amber1),var(--amber2))}
.t-ins{background:linear-gradient(160deg,var(--plum1),var(--plum2))}
.new{position:absolute;top:5px;inset-inline-start:7px;font-size:.58rem;font-weight:600;letter-spacing:.04em;z-index:1}
.star{position:absolute;top:5px;inset-inline-end:7px;width:10px;height:10px;z-index:1;fill:#fff}

/* the unique Etihad Everywhere tile */
.t-ee{background:radial-gradient(120% 120% at 20% 0%,#C2185B00 0,#0000 40%),linear-gradient(150deg,var(--burg1) 0%,#B0283F 45%,var(--o1) 100%);box-shadow:0 6px 18px rgb(138 16 48 / .35)}
.t-ee::before{display:none}
.t-ee .pulse{position:absolute;left:50%;top:58%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;border:2px solid rgb(255 255 255 / .7);animation:radar 2.2s var(--ease) infinite}
.t-ee .pulse.p2{animation-delay:1.1s}
.t-ee svg.pin{position:relative;width:30px;height:36px;margin-top:-6px;filter:drop-shadow(0 2px 3px rgb(0 0 0 / .25))}
.t-ee .glint{position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgb(255 255 255 / .28) 45%,transparent 60%);transform:translateX(-120%);animation:glint 4s var(--ease) infinite 1s}
.tile.ee .l{font-weight:600;color:var(--wine)}
@keyframes radar{0%{transform:scale(.5);opacity:.9}100%{transform:scale(2.6);opacity:0}}
@keyframes glint{0%,60%{transform:translateX(-120%)}100%{transform:translateX(120%)}}

/* bottom tab bar */
.tabbar{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-top:1px solid var(--line);padding:8px 8px calc(10px + env(safe-area-inset-bottom,0px))}
.tabbar button{display:grid;justify-items:center;gap:3px;background:none;border:0;cursor:pointer;color:#8D8A93;min-height:52px;font-size:.84rem}
.tabbar button[aria-current="page"]{color:var(--o2)}
.tabbar .ico{width:28px;height:28px}

/* full-screen feature */
.screen{position:absolute;inset:0;background:var(--ground);display:flex;flex-direction:column;z-index:20;animation:slidein .32s var(--ease) both}
@keyframes slidein{from{transform:translateX(100%)}to{transform:none}}
.ee-head{background:linear-gradient(150deg,var(--burg2),var(--burg1) 55%,#B0283F);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 14px;display:grid;gap:12px;position:relative;overflow:hidden}
.ee-head::after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;inset-inline-end:-90px;top:-120px;background:radial-gradient(circle,rgb(255 122 61 / .45),transparent 65%)}
.ee-top{display:flex;align-items:center;gap:8px;position:relative;z-index:1}
.ee-top .icon-btn{color:#fff}.ee-top .icon-btn:hover{background:rgb(255 255 255 / .12)}
.ee-brand{font-family:var(--f-brand);font-style:italic;font-weight:800;font-size:1.15rem;margin-inline:auto}
.ee-brand span{color:#FFC3A6}
.ee-hello{position:relative;z-index:1;display:grid;gap:2px}
.ee-hello small{opacity:.8}
.ee-hello b{font-size:1.25rem;font-weight:500}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:rgb(255 255 255 / .12);border-radius:14px;padding:4px;position:relative;z-index:1}
.seg button{border:0;border-radius:10px;background:none;color:#fff;padding:8px 2px;cursor:pointer;font-size:.82rem;min-height:40px;transition:background-color .2s var(--ease),color .2s var(--ease)}
.seg button[aria-selected="true"]{background:#fff;color:var(--wine);font-weight:600}
.panel{flex:1;overflow:auto;overscroll-behavior:contain;padding:14px;display:grid;gap:12px;align-content:start}
.card{background:var(--card);border-radius:18px;padding:16px;display:grid;gap:10px;box-shadow:0 1px 2px rgb(0 0 0 / .04)}
.card h3{margin:0;font-size:1rem;font-weight:600}
.card .sub{color:var(--muted);font-size:.84rem}
.big{font-size:2rem;font-weight:600;letter-spacing:-.01em}
.big small{font-size:.9rem;color:var(--muted);font-weight:400}
.row{display:flex;align-items:center;gap:10px}
.row.sb{justify-content:space-between}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat div{background:var(--ground);border-radius:14px;padding:10px 12px;display:grid;gap:2px}
.stat b{font-size:1.1rem;font-weight:600}
.stat small{color:var(--muted);font-size:.76rem}
.rankbar{height:10px;border-radius:6px;background:var(--line);overflow:hidden}
.rankbar span{display:block;height:100%;width:62%;background:linear-gradient(90deg,var(--burg1),var(--o1));border-radius:6px;transform-origin:left;animation:fill .9s var(--ease) both}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.ranks{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ranks div{border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;font-size:.74rem;color:var(--muted)}
.ranks div b{display:block;font-size:.92rem;color:var(--ink)}
.ranks div.on{border-color:var(--o2);background:var(--o-soft);color:var(--o-text)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;border-radius:14px;border:1px solid var(--line);background:var(--card);padding:10px 16px;font-weight:500;cursor:pointer;transition:background-color .2s var(--ease),border-color .2s var(--ease),transform .15s var(--ease)}
.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(160deg,var(--o1),var(--o2));border-color:transparent;color:#fff}
.btn.ghost{background:none;border-color:transparent;color:var(--o-text)}
.btn.full{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.74rem;font-weight:600}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-o{background:var(--o-soft);color:var(--o-text)}.p-w{background:#F6E6EA;color:var(--wine)}
.reco{border:1.5px solid var(--o2);background:linear-gradient(160deg,#FFF6F1,#fff)}
.list{display:grid;gap:8px;list-style:none;margin:0;padding:0}
.offer{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:10px;border-radius:14px;background:var(--ground);border:1px solid transparent;cursor:pointer;width:100%;text-align:start;transition:border-color .2s var(--ease),background-color .2s var(--ease)}
.offer:hover,.offer[aria-expanded="true"]{border-color:var(--o2);background:#fff}
.offer .lg{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-weight:600;color:#fff;font-size:1.05rem}
.offer b{display:block;font-weight:500}
.offer small{color:var(--muted);font-size:.78rem}
.offer .v{font-weight:600;color:var(--o-text);white-space:nowrap}
.calc{display:grid;gap:10px;background:var(--o-soft);border-radius:14px;padding:12px}
.field{display:grid;gap:4px;font-size:.84rem;color:var(--ink-2)}
.field input{border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:46px;background:#fff;font-size:1rem}
.line{display:flex;justify-content:space-between;gap:10px;font-size:.9rem}
.line.total{border-top:1px dashed #E6BFA8;padding-top:8px;font-weight:600;color:var(--o-text)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:6px 0;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:0}
.toggle span{display:grid;gap:2px}.toggle small{color:var(--muted);font-size:.78rem}
.switch{appearance:none;-webkit-appearance:none;width:52px;height:32px;border-radius:999px;background:#D4D1D8;position:relative;cursor:pointer;flex:none;transition:background-color .2s var(--ease)}
.switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgb(0 0 0 / .25);transition:transform .2s var(--ease)}
.switch:checked{background:var(--o2)}
.switch:checked::after{transform:translateX(20px)}
.notif{display:grid;gap:6px;padding:12px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.notif .app{display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--muted)}
.notif .app i{width:20px;height:20px;border-radius:6px;background:linear-gradient(150deg,var(--burg1),var(--o1));display:inline-block}
.notif b{font-weight:600}
.notif .why{font-size:.8rem;color:var(--ink-2);background:var(--ground);border-radius:10px;padding:8px 10px}
.empty{display:grid;justify-items:center;gap:10px;text-align:center;color:var(--muted);padding:22px 10px}
.empty .ico{width:34px;height:34px;color:var(--o2)}

/* sheet, dialog, toast */
.scrim{position:absolute;inset:0;background:rgb(20 16 24 / .45);z-index:40;display:flex;align-items:flex-end;animation:fade .2s var(--ease) both}
@keyframes fade{from{background:rgb(20 16 24 / 0)}}
.sheet{width:100%;max-height:85%;overflow:auto;overscroll-behavior:contain;background:#fff;border-radius:24px 24px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;animation:up .28s var(--ease) both}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);justify-self:center}
.sheet h3{margin:0;font-size:1.08rem}
.plan{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:12px;border:1px solid var(--line);border-radius:14px}
.plan.best{border-color:var(--o2);background:var(--o-soft)}
.plan.cur{border-style:dashed}
.plan b{font-weight:600}.plan small{color:var(--muted);font-size:.78rem}
.plan .net{font-weight:600;text-align:end}
.toast{position:absolute;inset-inline:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));background:#1E1E24;color:#fff;border-radius:14px;padding:12px 14px;z-index:60;display:flex;align-items:center;gap:10px;font-size:.88rem;animation:up .22s var(--ease) both}
.toast button{margin-inline-start:auto;background:none;border:0;color:#FFB48F;font-weight:600;cursor:pointer;min-height:36px}
/* consent popup */
.consent{display:grid;gap:12px}
.consent .hero-ico{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(150deg,var(--burg1),var(--o1));color:#fff;justify-self:center;position:relative}
.consent .hero-ico .ico{width:30px;height:30px}
.consent .hero-ico::after{content:"";position:absolute;inset:-6px;border-radius:24px;border:2px solid rgb(240 78 26 / .35);animation:radar 2.2s var(--ease) infinite}
.consent h3{text-align:center;font-size:1.15rem}
.consent p{margin:0;text-align:center;color:var(--ink-2);font-size:.9rem}
.choice{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:14px;cursor:pointer;transition:border-color .2s var(--ease),background-color .2s var(--ease)}
.choice:has(input:checked){border-color:var(--o2);background:var(--o-soft)}
.choice input{width:22px;height:22px;accent-color:var(--o2);flex:none;margin-top:2px}
.choice span{display:grid;gap:2px}.choice small{color:var(--muted);font-size:.8rem}
.steps{display:flex;justify-content:center;gap:6px}.steps i{width:22px;height:4px;border-radius:2px;background:var(--line)}.steps i.on{background:var(--o2)}
.summary{display:grid;gap:6px;background:var(--ground);border-radius:14px;padding:12px;font-size:.88rem}
.summary div{display:flex;justify-content:space-between;gap:10px}
/* map */
.map{position:relative;height:280px;border-radius:16px;overflow:hidden;background:#EEF0E6;touch-action:pan-y}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.me{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:#1D4ED8;border:3px solid #fff;box-shadow:0 2px 6px rgb(0 0 0 / .3);z-index:3}
.me::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid rgb(29 78 216 / .5);animation:radar 2s var(--ease) infinite}
.acc{position:absolute;left:50%;top:50%;border-radius:50%;background:rgb(29 78 216 / .12);border:1px solid rgb(29 78 216 / .35);transform:translate(-50%,-50%);z-index:1}
.mpin{position:absolute;z-index:2;transform:translate(-50%,-100%);display:grid;justify-items:center;background:none;border:0;padding:0;cursor:pointer;min-width:44px;min-height:44px}
.mpin b{display:grid;place-items:center;width:32px;height:32px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);color:#fff;font-size:.8rem;box-shadow:0 3px 8px rgb(0 0 0 / .25);border:2px solid #fff;transition:transform .2s var(--ease)}
.mpin b span{transform:rotate(45deg)}
.mpin small{margin-top:2px;background:#fff;border-radius:8px;padding:1px 6px;font-size:.66rem;font-weight:600;color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .15);white-space:nowrap}
.mpin:hover b,.mpin[aria-pressed="true"] b{transform:rotate(-45deg) scale(1.15)}
.map-tag{position:absolute;inset-inline-start:10px;bottom:10px;z-index:4;background:rgb(255 255 255 / .92);border-radius:10px;padding:5px 9px;font-size:.72rem;color:var(--ink-2);box-shadow:0 1px 4px rgb(0 0 0 / .12)}
.map-scale{position:absolute;inset-inline-end:10px;bottom:10px;z-index:4;font-size:.66rem;color:var(--ink-2);display:grid;justify-items:end;gap:2px}
.map-scale i{display:block;width:55px;height:4px;border:2px solid var(--ink-2);border-top:0}
/* map v2: filters, controls, user balloon with the Etihad Everywhere mark, shop markers, route, callout */
.map2{position:relative;height:340px;border-radius:18px;overflow:hidden;background:#EEF0E6;box-shadow:inset 0 0 0 1px rgb(0 0 0 / .04)}
.map2 svg.base{position:absolute;inset:-6%;width:112%;height:112%;transition:transform .35s var(--ease)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;min-height:38px;font-size:.82rem;cursor:pointer;transition:background-color .2s var(--ease),border-color .2s var(--ease),color .2s var(--ease)}
.chips button[aria-pressed="true"]{background:var(--wine);border-color:var(--wine);color:#fff}
.ctrl{position:absolute;inset-inline-end:10px;top:10px;z-index:6;display:grid;gap:6px}
.ctrl button{width:40px;height:40px;border-radius:12px;border:0;background:#fff;box-shadow:0 2px 8px rgb(0 0 0 / .15);display:grid;place-items:center;cursor:pointer;color:var(--ink);font-size:1.2rem;font-weight:600}
.ctrl button:hover{color:var(--o2)}
.ctrl .ico{width:20px;height:20px}
.count{position:absolute;inset-inline-start:10px;top:10px;z-index:6;background:rgb(255 255 255 / .94);border-radius:12px;padding:6px 10px;font-size:.76rem;font-weight:600;box-shadow:0 1px 6px rgb(0 0 0 / .12);display:flex;gap:6px;align-items:center}
.count i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;animation:blink 1.6s var(--ease) infinite}
@keyframes blink{50%{opacity:.35}}
.you{position:absolute;left:50%;top:56%;z-index:5;transform:translate(-50%,-100%);display:grid;justify-items:center;pointer-events:none}
.you .r{position:absolute;left:50%;bottom:-6px;width:44px;height:18px;margin-left:-22px;border-radius:50%;border:2px solid rgb(138 16 48 / .45);animation:ground 2.2s var(--ease) infinite}
.you .r.r2{animation-delay:1.1s}
@keyframes ground{0%{transform:scale(.4);opacity:1}100%{transform:scale(2.4);opacity:0}}
.you svg{width:52px;height:64px;filter:drop-shadow(0 6px 8px rgb(94 10 34 / .35));animation:bob 2.6s var(--ease) infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.you b{margin-top:2px;background:var(--wine);color:#fff;border-radius:999px;padding:1px 9px;font-size:.68rem;font-weight:600;box-shadow:0 2px 6px rgb(0 0 0 / .2)}

function model(){
  var cb=rankCb(ME.rank,ME.credit,ME.debit),next=ME.rank>1?rankCb(ME.rank-1,ME.credit,ME.debit)-cb:0;

  var gain=best.net-cur.net,hold=best.plan!==ME.plan&&gain<A.min_gain&&cur.net>=0;

    '<div class="line"><span>Your Rank '+ME.rank+' cashback '+rank+'%</span><span class="num">+'+jod(rcb)+'</span></div><div class="line total"><span>You gain</span><span class="num">'+jod(disc+partner+rcb)+'</span></div></form>';
}
function tabAlerts(){
  if(KILL)return '<div class="card empty">'+ico('shield')+'<b>Alerts are paused by the bank</b><span>Your cashback and card discounts still work when you pay.</span></div>';
  var items=INBOX.filter(function(n){return !n.dismissed});
  if(!CONSENT.marketing&&!CONSENT.location)return '<div class="card empty">'+ico('bell')+'<b>Alerts are off</b><span>You turned off location and offers. Your monthly summary is still in For you.</span></div>';
  return '<div class="card"><div class="row sb"><h3>Alerts</h3><span class="sub">Max 2 a day · quiet 22:00–08:00</span></div>'+(items.length?items.map(function(n){var o=n.offer&&OFFERS.filter(function(x){return x.id===n.offer})[0];
    return '<article class="notif" aria-labelledby="nt-'+n.id+'"><span class="app"><i aria-hidden="true"></i>Etihad Everywhere · now</span><b id="nt-'+n.id+'">'+esc(n.title)+'</b><span>'+esc(n.body)+'</span>'+(n.showWhy?'<span class="why">'+esc(n.why)+'</span>':'')+
    '<div class="row"><button type="button" class="btn primary" data-act="'+(o?'see-offer':'tab')+'" data-tab="you" data-id="'+(o?o.id:'')+'">'+(o?'Show offer':'Open summary')+'</button><button type="button" class="btn ghost" data-act="why" data-id="'+n.id+'" aria-expanded="'+!!n.showWhy+'">Why did I get this?</button><button type="button" class="btn ghost" data-act="dismiss" data-id="'+n.id+'" aria-label="Not interested in: '+esc(n.title)+'">Not interested</button></div></article>'}).join(''):'<div class="empty">'+ico('bell')+'<b>All caught up</b><span>New alerts appear here when you are near a partner.</span></div>')+'</div>';
}
function tabPrivacy(){
  var t=[['location','Use my location','Alerts when you are near a partner. Your route is never stored.'],['analysis','Analyse my card spend','Monthly savings summary and plan advice.'],['marketing','Offers and alerts','At most 2 a day, never 22:00–08:00.']];
  return '<div class="card"><h3>Your choices</h3>'+t.map(function(x){return '<label class="toggle" for="c-'+x[0]+'"><span><b>'+x[1]+'</b><small>'+x[2]+'</small></span><input class="switch" type="checkbox" role="switch" id="c-'+x[0]+'" data-consent="'+x[0]+'"'+(CONSENT[x[0]]?' checked':'')+'></label>'}).join('')+'</div>'+
  '<div class="card"><h3>Your data</h3><span class="sub">AI writes the wording of alerts; the numbers come from the bank. No name, phone or account number is sent to the AI.</span><button type="button" class="btn" data-act="all-off">Turn everything off</button></div>';
}

/* ---------- overlays: plan sheet, confirm ---------- */
function closeOverlay(){$('overlay').innerHTML=''}
function showSheet(html,label){$('overlay').innerHTML='<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="'+label+'"><span class="grab" aria-hidden="true"></span>'+html+'</div></div>';var f=$('overlay').querySelector('button');if(f)f.focus()}
function plansSheet(){
  var m=model();
  showSheet('<h3>Compare plans for you</h3><span class="sub">Value from your own October use, minus the monthly fee.</span>'+m.rows.map(function(r){var best=r.plan===m.best.plan,cur=r.plan===ME.plan;
    return '<div class="plan'+(best?' best':'')+(cur?' cur':'')+'"><b>'+r.plan+(cur?' · current':'')+(best&&!cur?' · best for you':'')+'</b><span class="net num" style="color:'+(r.net<0?'var(--bad)':'var(--ok)')+'">'+(r.net<0?'−':'+')+jod(Math.abs(r.net))+'</span><small>'+PLANS[r.plan].perks+'</small><small class="num" style="text-align:end">'+jod(r.fee)+'/mo</small></div>'}).join('')+
    (m.best.plan!==ME.plan?'<button type="button" class="btn primary full" data-act="subscribe" data-plan="'+m.best.plan+'">Switch to '+m.best.plan+' · '+jod(PLANS[m.best.plan].fee)+'/month</button>':'')+'<button type="button" class="btn full" data-act="close-sheet">Not now</button>','Compare plans');
}
function confirmSheet(title,body,okLabel,act,data){showSheet('<h3>'+title+'</h3><span>'+body+'</span><button type="button" class="btn primary full" data-act="'+act+'" '+(data||'')+'>'+okLabel+'</button><button type="button" class="btn full" data-act="close-sheet">Cancel</button>',title)}
var toastT;
function toast(msg,undo){var t=$('toast');t.innerHTML='<span>'+esc(msg)+'</span>'+(undo?'<button type="button" data-act="undo">Undo</button>':'');t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true;undoFn=null},5000);undoFn=undo||null}
var undoFn=null;

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var tile=e.target.closest('[data-tile]');
  if(tile){if(tile.getAttribute('data-tile')==='ee')openEE('you',tile);else toast(tile.textContent.trim()+' is not part of this prototype.');return}
  var tb=e.target.closest('[data-tab]:not([data-act])');if(tb){if(tb.getAttribute('data-tab')!=='hub')toast('Only the Hub tab is part of this prototype.');return}
  if(e.target.closest('#bell')){openEE('alerts',e.target.closest('#bell'));$('bell-dot').hidden=true;return}
  if(e.target.closest('#plan-chip')){openEE('you',e.target.closest('#plan-chip'));plansSheet();return}
  var b=e.target.closest('[data-act]');if(!b)return;var a=b.getAttribute('data-act');
  if(a==='scrim'&&e.target===b){closeOverlay();return}
  if(a==='cs-next'){e.preventDefault();[].forEach.call(document.querySelectorAll('[data-draft]'),function(c){DRAFT[c.getAttribute('data-draft')]=c.checked});consentStep2();return}
  if(a==='cs-back'){consentStep1();return}
  if(a==='cs-later'){closeOverlay();CONSENT={location:false,analysis:false,marketing:false};saveConsent();emit('consent',{consent:CONSENT,confirmed:false,source:'not now'});renderEE();toast('Nothing is shared. You can turn things on in Privacy.');return}
  if(a==='cs-confirm'){CONSENT=Object.assign({},DRAFT);saveConsent();CONFIRMED={at:new Date().toISOString(),choices:DRAFT};try{localStorage.setItem('ee_confirmed',JSON.stringify(CONFIRMED))}catch(_){}
    emit('consent',{consent:CONSENT,confirmed:true,source:'popup'});
    closeOverlay();EE.tab=CONSENT.location?'near':'you';renderEE();toast('Your choices are saved.');if(CONSENT.location)locate();return}
  if(a==='locate'){locate();return}
  if(a==='sample-loc'){useSample();return}
  if(a==='filter'){EE.filter=b.getAttribute('data-f');if(EE.sel&&EE.filter!=='all'){var so=OFFERS.filter(function(o){return o.id===EE.sel})[0];if(so&&so.type!==EE.filter){EE.sel=null;EE.walk=false}}renderEE();focusAct('filter','data-f',EE.filter);return}
  if(a==='zoom'){EE.zoom=b.getAttribute('data-z')==='in'?Math.min(1.8,EE.zoom+0.35):Math.max(0.55,EE.zoom-0.35);renderEE();focusAct('zoom','data-z',b.getAttribute('data-z'));return}
  if(a==='recenter'){EE.zoom=1;EE.sel=null;EE.walk=false;renderEE();focusAct('recenter');return}
  if(a==='shop'){var sid=b.getAttribute('data-id');EE.sel=EE.sel===sid?null:sid;EE.walk=!!EE.sel;if(EE.sel){var so2=OFFERS.filter(function(o){return o.id===sid})[0];emit('offer-view',{id:sid,name:so2&&so2.name,via:'map'})}renderEE();var cb=document.querySelector('.callout .btn.primary');if(cb)cb.focus({preventScroll:true});return}
  if(a==='shop-close'){var was=EE.sel;EE.sel=null;EE.walk=false;renderEE();focusAct('shop','data-id',was);return}
  if(a==='walk'){EE.walk=!EE.walk;renderEE();focusAct('walk');return}
  if(a==='walk-mode'){if(!GEO.base||!Object.keys(GEO.base).length)geoInit();walkToggle(!GEO.walk);focusAct('walk-mode');return}
  if(a==='shop-offer'){a='pin'}
  if(a==='pin'){var pid=b.getAttribute('data-id');EE.openOffer=pid;var po=OFFERS.filter(function(o){return o.id===pid})[0];emit('offer-calc',{id:pid,name:po&&po.name});renderEE();var row=document.querySelector('[data-act="offer"][data-id="'+pid+'"]');if(row){row.scrollIntoView({block:'center'});row.focus({preventScroll:true})}return}
  if(a==='back')closeEE();
  else if(a==='tab'){EE.tab=b.getAttribute('data-tab');closeOverlay();renderEE();var nt=$('tab-'+EE.tab);if(nt)nt.focus();if(EE.tab==='near'&&CONSENT.location&&LOC.status==='idle'&&CONFIRMED)locate()}
  else if(a==='offer'){var id=b.getAttribute('data-id');EE.openOffer=EE.openOffer===id?null:id;renderEE();var ob=document.querySelector('[data-act="offer"][data-id="'+id+'"]');if(ob)ob.focus()}
  else if(a==='see-offer'){EE.tab='near';EE.openOffer=b.getAttribute('data-id');renderEE()}
  else if(a==='why'){var n=INBOX.filter(function(x){return x.id===b.getAttribute('data-id')})[0];n.showWhy=!n.showWhy;if(n.showWhy)emit('alert-why',{id:n.id,title:n.title});renderEE()}
  else if(a==='dismiss'){var n2=INBOX.filter(function(x){return x.id===b.getAttribute('data-id')})[0];n2.dismissed=true;emit('alert-dismiss',{id:n2.id,title:n2.title});renderEE();toast('You will see fewer alerts like this.',function(){n2.dismissed=false;emit('alert-undismiss',{id:n2.id,title:n2.title});renderEE()})}
  else if(a==='claim')confirmSheet('Move '+jod(ME.vault)+' to your account?','Your vault balance goes to your current account today.','Move to my account','claim-ok');
  else if(a==='claim-ok'){var amt=ME.vault;ME.claimed=true;ME.vault=0;emit('vault-claim',{amount:amt});closeOverlay();renderEE();toast('Moved to your account.')}
  else if(a==='plans')plansSheet();
  else if(a==='keep'){emit('keep-plan',{plan:ME.plan});toast('Got it. We will not suggest a new plan for 3 months.');}
  else if(a==='subscribe'){var p=b.getAttribute('data-plan');confirmSheet('Switch to '+p+'?',p+' costs '+jod(PLANS[p].fee)+' a month. You can switch back at any time.','Confirm '+p,'subscribe-ok','data-plan="'+p+'"')}
  else if(a==='subscribe-ok'){var old=ME.plan,np=b.getAttribute('data-plan');ME.plan=np;$('plan-name').textContent=np;emit('plan-switch',{from:old,to:np});closeOverlay();renderEE();toast('You are now on '+np+'.',function(){ME.plan=old;$('plan-name').textContent=old;emit('plan-switch',{from:np,to:old,undo:true});renderEE()})}
  else if(a==='close-sheet')closeOverlay();
  else if(a==='consent-on'){CONSENT[b.getAttribute('data-k')]=true;saveConsent();emit('consent',{consent:CONSENT,confirmed:!!CONFIRMED,source:'turned on '+b.getAttribute('data-k')});renderEE()}
  else if(a==='all-off')confirmSheet('Turn everything off?','No alerts, no spend analysis and no location. Card discounts and cashback still work when you pay.','Turn everything off','all-off-ok');
  else if(a==='all-off-ok'){CONSENT={location:false,analysis:false,marketing:false};saveConsent();emit('consent',{consent:CONSENT,confirmed:!!CONFIRMED,source:'everything off'});closeOverlay();renderEE();toast('Everything is off.')}
  else if(a==='undo'&&undoFn){var f=undoFn;undoFn=null;$('toast').hidden=true;f()}
});
document.addEventListener('change',function(e){var k=e.target.getAttribute('data-consent');if(k){CONSENT[k]=e.target.checked;saveConsent();
  if(k==='location'&&!e.target.checked){LOC={status:'idle',lat:null,lng:null,acc:null,sample:false,err:''};geoStop()}   /* location off: forget the position at once */
  emit('consent',{consent:CONSENT,confirmed:!!CONFIRMED,source:'privacy switch '+k});
  toast(e.target.checked?'Turned on.':'Turned off. Applies right away.')}});
document.addEventListener('input',function(e){
  if(e.target.id==='pay-amt'){var v=parseFloat(e.target.value);if(v>0){EE.amount=v;var f=e.target.closest('form'),o=OFFERS.filter(function(x){return x.id===f.getAttribute('data-id')})[0],pos=e.target.selectionStart;f.outerHTML=calc(o);var ni=$('pay-amt');ni.focus();try{ni.setSelectionRange(pos,pos)}catch(_){}}}
  if(e.target.id==='easy-amt'||e.target.id==='easy-m')easyOut();
});
document.addEventListener('submit',function(e){e.preventDefault()});
function easyOut(){var o=$('easy-out');if(!o)return;var amt=parseFloat($('easy-amt').value),mo=parseInt($('easy-m').value,10);
  o.innerHTML=amt>0&&mo>=3&&mo<=36?'<span>'+mo+' months at 0%</span><span class="num">'+jod(amt/mo)+' / month</span>':'<span>Enter a price and 3–36 months</span><span></span>'}
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){if($('overlay').innerHTML)closeOverlay();else if(!$('ee').hidden)closeEE()}
  if((e.key==='ArrowRight'||e.key==='ArrowLeft')&&e.target.getAttribute('role')==='tab'){var ts=['you','near','alerts','privacy'],i=ts.indexOf(EE.tab);i=(i+(e.key==='ArrowRight'?1:-1)+4)%4;EE.tab=ts[i];renderEE();$('tab-'+EE.tab).focus()}
});
/* ---------- connection to the Etihad Everywhere Console ----------
   When this app runs inside the console, the console is the source of truth: it sends the customer, consent,
   approved offers, alerts, the stop switch and the reference values; the app reports every customer action back.
   On its own (standalone link) the app keeps working with its local demo data. */
var HOST=false,KILL=false,PALETTE=['#B0283F','#0F766E','#C2410C','#1D4ED8','#6D28D9','#334155','#047857','#9D174D','#A16207','#0369A1'];
function emit(kind,data){if(!HOST)return;try{window.parent.postMessage({type:'ee-event',kind:kind,ref:ME.ref||null,data:data||{}},'*')}catch(e){}}
function hashN(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h}
function applyState(s){
  HOST=true;
  var refChanged=s.customer&&s.customer.ref!==ME.ref;
  if(s.customer)ME=Object.assign({claimed:false},s.customer);
  if(refChanged){geoStop();GEO.base={};GEO.target=0;SEEN={};SEEN._init=false}
  if(s.consent)CONSENT=Object.assign({},s.consent);
  CONFIRMED=s.confirmed?{at:s.confirmedAt||'',choices:CONSENT}:null;
  if(s.assumptions)A=Object.assign(A,s.assumptions);
  KILL=!!s.kill;
  if(Array.isArray(s.offers)&&s.offers.length){OFFERS=s.offers.map(function(o){var h=hashN(o.id+o.name);var known={Fraij:120,'Ikura Jordan':340,'Souq Fann':450};
    return {id:o.id,name:o.name,type:o.type==='cashback'?'cashback':'discount',rate:o.rate||0,dist:known[o.name]||(150+h%1650),color:PALETTE[h%PALETTE.length],cat:o.type==='cashback'?'Partner cashback':'Card discount'}});
    OFFERS.forEach(function(o){if(BEARING[o.id]==null)BEARING[o.id]=hashN(o.id)%360});
    if(Object.keys(GEO.base).length)geoUpdate(true);}   /* keep the customer's walked position when the console pushes new state */
  if(Array.isArray(s.alerts)){var old={};INBOX.forEach(function(n){old[n.id]=n});INBOX=s.alerts.map(function(n){var o=old[n.id];return Object.assign({},n,{dismissed:n.dismissed||(o&&o.dismissed),showWhy:o&&o.showWhy})});
    var fresh=INBOX.filter(function(n){return !SEEN[n.id]&&!n.dismissed});INBOX.forEach(function(n){SEEN[n.id]=1});
    if(SEEN._init&&fresh.length&&!KILL)showPush(fresh[fresh.length-1]);SEEN._init=true}
  $('plan-name').textContent=ME.plan;
  var pr=document.querySelector('.proto');if(pr)pr.textContent='Connected to the Etihad Everywhere Console · '+(ME.ref||'')+' · synthetic data';
  $('bell-dot').hidden=!INBOX.some(function(n){return !n.dismissed});
  if(!$('ee').hidden)renderEE();
  if(s.open&&$('ee').hidden)openEE(s.open);
}
window.addEventListener('message',function(e){
  if(e.source!==window.parent||!e.data||e.data.type!=='ee-state')return;
  applyState(e.data);
});
renderHub();
if(window.parent!==window){try{window.parent.postMessage({type:'ee-ready'},'*')}catch(e){}}
if(location.hash==='#etihad-everywhere')openEE('you');
</script>
